# Package a Helm chart and push it to an OCI registry. The caller owns the
# manual trigger and its RELEASE confirmation. The registry is the release
# record: no git tag is created.
name: helm-release

on:
  workflow_call:
    inputs:
      runs-on:
        description: runner labels as JSON (e.g. '["self-hosted", "lax"]' for a private repo)
        type: string
        default: '"ubuntu-latest"'
      chart-path:
        type: string
        default: .
      helm-version:
        # renovate: datasource=github-releases depName=helm/helm
        type: string
        default: v3.16.0
      registry:
        type: string
        default: oci://ghcr.io/lightwebinc/charts
      environment:
        description: GitHub Environment gating the push ("" for none)
        type: string
        default: production
      dry-run:
        type: boolean
        default: false

jobs:
  release:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: ${{ inputs.helm-version }}

      - name: Login to GHCR
        if: ${{ !inputs.dry-run }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A dry run still proves the push would be ALLOWED: get a push-scoped
      # registry token, open a blob upload session (202 = write granted), then
      # cancel it. Nothing is published. Catches a package that has not
      # granted this repository Actions write access, which otherwise only
      # surfaces as a 403 on the real release.
      - name: Verify registry push access (dry run)
        if: inputs.dry-run
        working-directory: ${{ inputs.chart-path }}
        env:
          REGISTRY: ${{ inputs.registry }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          name=$(awk '/^name:/ {print $2; exit}' Chart.yaml)
          repo="${REGISTRY#oci://ghcr.io/}/$name"
          token=$(curl -fsS -u "$ACTOR:$GH_TOKEN" \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:$repo:push,pull" | jq -r .token)
          code=$(curl -s -o /dev/null -D /tmp/upload.h -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $token" "https://ghcr.io/v2/$repo/blobs/uploads/")
          if [ "$code" != 202 ]; then
            echo "::error::no push access to ghcr.io/$repo (HTTP $code). Grant this repository Actions write on the package: package settings, Manage Actions access."
            exit 1
          fi
          loc=$(awk 'tolower($1)=="location:" {print $2}' /tmp/upload.h | tr -d '\r')
          case "$loc" in http*) url="$loc" ;; *) url="https://ghcr.io$loc" ;; esac
          curl -s -o /dev/null -X DELETE -H "Authorization: Bearer $token" "$url" || true
          echo "push access to ghcr.io/$repo: OK (upload session opened and cancelled)"

      - name: Package (and push)
        working-directory: ${{ inputs.chart-path }}
        env:
          REGISTRY: ${{ inputs.registry }}
          DRY: ${{ inputs.dry-run }}
        run: |
          helm package .
          for tgz in *.tgz; do
            if [ "$DRY" = "true" ]; then
              echo "dry run: would push $tgz to $REGISTRY"
            else
              helm push "$tgz" "$REGISTRY"
            fi
          done
