# GitHub release with generated notes for the tag that triggered the caller.
name: gh-release

on:
  workflow_call:
    inputs:
      runs-on:
        description: runner labels as JSON (e.g. '["self-hosted", "lax"]' for a private repo)
        type: string
        default: '"ubuntu-latest"'

jobs:
  release:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
