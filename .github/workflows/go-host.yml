# Plain host-Go checks for repos without a Dagger pipeline: build, vet, race
# tests, and optional gofmt, tidy, cross-OS, golangci-lint and licence checks.
name: go-host

on:
  workflow_call:
    inputs:
      go-version:
        # Pin the BUILDER version explicitly. go-version-file would install the
        # go.mod language floor, which can be older than what the shipped
        # binaries are built with, and scanners then report stdlib advisories
        # the real builds have already fixed.
        # renovate: datasource=golang-version depName=go
        type: string
        default: "1.27.1"
      goos:
        description: JSON list of GOOS targets; linux runs tests, others build and vet
        type: string
        default: '["linux"]'
      gofmt:
        type: boolean
        default: false
      tidy-check:
        type: boolean
        default: false
      race:
        type: boolean
        default: true
      licences-check:
        description: run scripts/gen-third-party-licenses.py . --check
        type: boolean
        default: false
      golangci-lint-version:
        description: empty skips the lint job
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.goos }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: ${{ fromJSON(inputs.goos) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}
      - name: gofmt
        if: inputs.gofmt && matrix.goos == 'linux'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go mod tidy check
        if: inputs.tidy-check && matrix.goos == 'linux'
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: vet
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: amd64
        run: go vet ./...
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: amd64
        run: go build -buildvcs=false ./...
      - name: test
        if: matrix.goos == 'linux'
        run: go test ${{ inputs.race && '-race' || '' }} ./...
      - name: third-party licences are current
        if: inputs.licences-check && matrix.goos == 'linux'
        run: python3 scripts/gen-third-party-licenses.py . --check

  lint:
    name: golangci-lint
    if: inputs.golangci-lint-version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ inputs.golangci-lint-version }}
