# Build a repo's Dockerfile at a git tag and push it to GHCR.
#
# The caller owns the manual trigger and its RELEASE confirmation. The image is
# built from refs/tags/v<tag>, so publishing fails when that git tag does not
# exist: push the tag first. dry-run builds the same tree and pushes nothing.
name: image-publish

on:
  workflow_call:
    inputs:
      tag:
        description: image tag without the v prefix (git tag v<tag> must exist)
        type: string
        required: true
      image:
        description: image name under ghcr.io/<owner>/ (default the repository name)
        type: string
        default: ""
      environment:
        description: GitHub Environment gating the push ("" for none)
        type: string
        default: production
      latest:
        description: also move the latest tag
        type: boolean
        default: true
      dry-run:
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ inputs.image || github.event.repository.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/v${{ inputs.tag }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        if: ${{ !inputs.dry-run }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: ${{ !inputs.dry-run }}
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ inputs.tag }}
            ${{ inputs.latest && format('{0}:latest', env.IMAGE) || '' }}
          build-args: |
            VERSION=${{ inputs.tag }}
