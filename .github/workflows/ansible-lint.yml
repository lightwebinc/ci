# yamllint and ansible-lint for an Ansible tree. Repo policy (skip lists,
# per-file ignores) stays in the caller's .ansible-lint, .ansible-lint-ignore
# and .yamllint* files; this file only pins the tools.
name: ansible-lint

on:
  workflow_call:
    inputs:
      runs-on:
        description: runner labels as JSON (e.g. '["self-hosted", "<label>"]' for a private repo)
        type: string
        default: '"ubuntu-latest"'
      path:
        type: string
        default: ansible/
      python-version:
        type: string
        default: "3.12"
      ansible-lint-version:
        # renovate: datasource=pypi depName=ansible-lint
        type: string
        default: 26.11.0
      yamllint-version:
        # renovate: datasource=pypi depName=yamllint
        type: string
        default: 1.38.0
      collections:
        description: ansible-galaxy collection specs, space separated
        type: string
        default: "community.general>=10.0 ansible.posix>=2.0"

permissions:
  contents: read

jobs:
  yamllint:
    name: yamllint
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}
      - env:
          YAMLLINT_VERSION: ${{ inputs.yamllint-version }}
        run: pip install "yamllint==$YAMLLINT_VERSION"
      - env:
          TARGET_PATH: ${{ inputs.path }}
        run: yamllint "$TARGET_PATH"

  ansible-lint:
    name: ansible-lint
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}
      - env:
          ANSIBLE_LINT_VERSION: ${{ inputs.ansible-lint-version }}
        run: pip install "ansible-lint==$ANSIBLE_LINT_VERSION"
      - name: Install Ansible collections
        env:
          COLLECTIONS: ${{ inputs.collections }}
        run: |
          # shellcheck disable=SC2086 # word list by design
          ansible-galaxy collection install $COLLECTIONS
      - env:
          TARGET_PATH: ${{ inputs.path }}
        run: ansible-lint "$TARGET_PATH"
