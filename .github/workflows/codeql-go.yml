# CodeQL for Go. The caller grants security-events: write, actions: read and
# contents: read. Code scanning uploads are only accepted on public
# repositories without a paid plan, so a private caller skips cleanly and the
# job starts running by itself if the repository is made public.
name: codeql-go

on:
  workflow_call:
    inputs:
      build-mode:
        description: autobuild, or manual (go build ./... in the repo)
        type: string
        default: autobuild
      common:
        description: build against a sibling checkout of the shared Go module
        type: boolean
        default: true
      common-repository:
        type: string
        default: lightwebinc/shard-common

jobs:
  analyze:
    name: analyze
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ${{ github.event.repository.name }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.common
        with:
          repository: ${{ inputs.common-repository }}
          path: shard-common

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ github.event.repository.name }}/go.mod

      - name: Use the sibling shared module
        if: inputs.common
        working-directory: ${{ github.event.repository.name }}
        run: go mod edit -replace "github.com/${{ inputs.common-repository }}=../shard-common"

      - name: Initialize CodeQL (autobuild)
        if: inputs.build-mode == 'autobuild'
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: go

      - name: Initialize CodeQL (manual build)
        if: inputs.build-mode == 'manual'
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: go
          build-mode: manual

      - name: Autobuild
        if: inputs.build-mode == 'autobuild'
        uses: github/codeql-action/autobuild@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2

      - name: Build for CodeQL
        if: inputs.build-mode == 'manual'
        working-directory: ${{ github.event.repository.name }}
        run: go build -buildvcs=false ./...

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:go"
